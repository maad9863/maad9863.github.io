<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Christmas Trivia</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app">
        <header>Random Christmas Trivia</header>

        <section class="quotes">
            <div id="js-quote-text"></div>
            <div id="js-answer-text"></div>
        </section>

        <section class="controls">
            <button type="button" id="js-new-quote">
                Generate a new bit of trivia!
            </button>
            <button type="button" id="js-tweet">
                Show me the answer!
            </button>
        </section>
    </div>

    <script src="ica12.js"></script>
</body>
</html>
